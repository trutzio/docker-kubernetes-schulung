apiVersion: v1
kind: Pod
metadata:
  name: speicher-test
spec:
  containers:
    - name: busybox
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - name: daten
          mountPath: /daten
  volumes:
    - name: daten
      persistentVolumeClaim:
        claimName: speicher-test
