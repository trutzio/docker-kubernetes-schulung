apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: petclinic-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: petclinic-secret
  data:
    - secretKey: password
      remoteRef:
        key: petclinic
        property: password
