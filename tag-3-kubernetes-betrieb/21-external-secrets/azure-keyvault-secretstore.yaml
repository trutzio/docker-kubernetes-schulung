apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      tenantId: "[tenant-id]"
      vaultUrl: "https://[name].vault.azure.net"
      authSecretRef:
        clientId:
          name: azure-zugang
          key: client-id
        clientSecret:
          name: azure-zugang
          key: client-secret
